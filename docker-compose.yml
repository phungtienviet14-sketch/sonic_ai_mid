version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-chaidim}
      POSTGRES_DB: ${DB_NAME:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  main:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    environment:
      - DB_HOST=db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      - db
      - gateway

  gateway:
    build: .
    command: uvicorn gateway:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    depends_on:
      - math_server

  math_server:
    build: .
    command: uvicorn mcp_math_server:app --host 0.0.0.0 --port 8002
    ports:
      - "8002:8002"

volumes:
  pgdata: