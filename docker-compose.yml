version: '3.8'

services:
  db:
    image: postgres:15
    container_name: robot_postgres_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-chaidim}
      POSTGRES_DB: ${DB_NAME:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    container_name: robot_searxng
    ports:
      - "8080:8080"
    volumes:
      - ./docker/searxng:/etc/searxng
    restart: unless-stopped

  main:
    build: .
    container_name: robot_ai_backend
    # Lệnh khởi chạy Server FastAPI
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      # Truyền biến môi trường để main.py tự động nhận diện Database trong mạng Docker
      - DB_HOST=db
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-chaidim}
      - DB_NAME=${DB_NAME:-postgres}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SEARXNG_URL=http://searxng:8080
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - LLM_MODEL=${LLM_MODEL:-gemini-2.5-flash}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL}
    ports:
      - "8000:8000"
    depends_on:
      - db
      - searxng
    restart: unless-stopped

volumes:
  pgdata: